<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaff">
  <title>حلّها — الكسور المتكافئة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-slot school-slot">
      <div class="school-icon">🏫</div>
      <div class="school-copy"><strong>ابتدائية الأبناء الثانية بالبحرية</strong><small>تحدي حلّها • الرياضيات</small></div>
    </div>
    <div class="lesson-head">
      <span class="lesson-badge">الرياضيات</span>
      <div><small>الرياضيات</small><strong>الكسور المتكافئة</strong></div>
      <span class="bulb">💡</span>
    </div>
    <div class="top-slot teacher-slot">
      <div class="teacher-name">👩‍🏫 المعلمة: سلمى العسيري</div>
      <div class="datebox" id="dateBox"></div>
    </div>
  </header>

  <main id="app"></main>
  <div class="sound-dock">
    <button id="soundBtn" class="sound-btn" type="button">🔊 الصوت</button>
    <button id="testSound" class="test-btn" type="button">اختبار</button>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
